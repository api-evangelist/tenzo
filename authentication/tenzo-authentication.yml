  redirect_uri_limit: 3
  notes: >-
    Partner applications are provisioned manually by Tenzo (email partnerships@gotenzo.com) and
    receive a Client ID, Client Secret, and a granted set of scopes. The Authorization Code grant
    exchanges an authorization code for an access token (10-hour lifetime) plus a non-expiring
    refresh token. Access tokens are passed either as an `Authorization: Bearer` header or an
    `X-AUTH-TOKEN` header on requests to https://api.gotenzo.com/public/v1. HTTPS is required.
