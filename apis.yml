aid: tenzo
name: Tenzo
description: >-
  Tenzo is a restaurant analytics and business-intelligence platform that unifies data from
  point-of-sale, labor scheduling, inventory, reviews, and reservation systems into a single
  reporting layer. It aggregates across 90+ integrated platforms and layers AI, demand
  forecasting, and automated reporting on top so multi-site restaurant operators can manage
  staffing, food and labor cost, and revenue. Tenzo exposes a public REST API
  (api.gotenzo.com/public/v1), an OAuth 2.0 Authorization Code (PKCE) partner integration for
  per-customer access, and a hosted Model Context Protocol (MCP) server for connecting AI
  assistants directly to restaurant data.
